/* ---------- helpers ---------- */
const R=(a,b)=>a+Math.random()*(b-a);
const rough='rough({strength:2,points:14,template:none.out,taper:out,randomize:true,clamp:false})';
function shake(power=14,dur=.35){if(RM)return;gsap.fromTo(shakeEl,{x:0,y:0},{duration:dur,ease:'steps(8)',keyframes:[...Array(7)].map(()=>({x:R(-power,power),y:R(-power,power),rotation:R(-.6,.6),duration:dur/7})).concat([{x:0,y:0,rotation:0,duration:.05}])});}
function flash(color,o=.85){gsap.fromTo('#flash',{opacity:o,background:color},{opacity:0,duration:.35,ease:'steps(4)'});}
const ids=re=>MAN.filter(m=>re.test(m.id)).map(m=>E[m.id]).filter(Boolean);

// glitch-in for a text line: clipped reveal in hard steps + colour split + jitter
function glitchIn(tl,el,at,dur=.55){
  tl.fromTo(el,{clipPath:'inset(0 100% 0 0)',x:R(-30,30),filter:'drop-shadow(6px 0 #33ea1f) drop-shadow(-6px 0 #f0524f)'},
    {clipPath:'inset(0 0% 0 0)',x:0,duration:dur,ease:'steps(9)'},at)
   .to(el,{filter:'drop-shadow(0px 0 rgba(0,0,0,0)) drop-shadow(0px 0 rgba(0,0,0,0))',duration:.25,ease:'steps(3)'},'>-0.05')
   .fromTo(el,{skewX:0},{keyframes:[{skewX:-18,duration:.04},{skewX:12,duration:.04},{skewX:0,duration:.04}]},at+dur*.6);
}
// stamp: slams down from big, rotated
function stamp(tl,el,at,rot=R(-14,14)){
  tl.fromTo(el,{scale:3.2,rotation:rot,opacity:0,transformOrigin:'50% 50%'},{scale:1,rotation:0,opacity:1,duration:.22,ease:'power4.in'},at)
    .add(()=>shake(6,.18),at+.22);
}

/* ---------- PAGE 1 ---------- */
let idle1=[],idle2=[];
function killIdle(list){list.forEach(t=>t.kill());list.length=0}
function page1(){
  killIdle(idle1);
  const tl=gsap.timeline({defaults:{overwrite:'auto'}});
  const all=[...p1.querySelectorAll('.L')];
  gsap.set(all,{clearProps:'transform,opacity,clipPath,filter'});
  if(RM){return tl}
  // background: hard flicker on
  tl.fromTo(E.p1_bg,{opacity:0},{opacity:1,duration:.3,ease:'steps(5)'},0);
  // newspaper tears in from jagged clip
  tl.fromTo(E.p1_news,{clipPath:'polygon(0 100%,10% 100%,20% 100%,35% 100%,50% 100%,65% 100%,80% 100%,100% 100%,100% 100%,0 100%)'},
    {clipPath:'polygon(0 0,10% 4%,20% 0,35% 6%,50% 0,65% 5%,80% 0,100% 3%,100% 100%,0 100%)',duration:.6,ease:'steps(6)'},.15);
  // buildings slam up
  tl.fromTo(E.p1_bld,{y:700},{y:0,duration:.45,ease:'power4.in'},.3).add(()=>shake(18,.4),.75);
  // splashes splat
  [E.p1_splTL,E.p1_splB,E.p1_fig].forEach((el,i)=>{
    tl.fromTo(el,{scale:0,rotation:R(-40,40),transformOrigin:'50% 50%',opacity:0},{scale:1,rotation:0,opacity:1,duration:.3,ease:'back.out(3)'},.8+i*.12);
  });
  tl.fromTo(E.p1_fig,{x:-25},{x:0,duration:.4,ease:'steps(5)'},1.05);
  // the cross falls and stabs
  tl.fromTo(E.p1_cross,{y:-1100,rotation:-35,transformOrigin:'70% 90%'},{y:0,rotation:0,duration:.42,ease:'power4.in'},1.05)
    .to(E.p1_cross,{keyframes:[{rotation:6,duration:.05},{rotation:-4,duration:.05},{rotation:2,duration:.05},{rotation:0,duration:.05}]})
    .add(()=>{shake(22,.4);flash('#2a0b45',.5)},1.47);
  // the mouth bites in
  tl.fromTo(E.p1_mouth,{scale:4,opacity:0,rotation:-12,transformOrigin:'45% 55%'},{scale:1,opacity:1,rotation:0,duration:.3,ease:'power4.in'},1.6)
    .add(()=>{shake(26,.45);flash('#f0524f',.55)},1.9)
    .to(E.p1_mouth,{keyframes:[{scaleY:.9,duration:.06},{scaleY:1.05,duration:.06},{scaleY:1,duration:.06}]},1.9);
  // letters: each one dropped from a different height and angle, hits, bounces like a pogo
  const L=ids(/^p1_L\d$/);
  L.forEach((el,i)=>{
    const t=2.05+i*.11+R(-.03,.05);
    tl.fromTo(el,{y:-R(900,1300),x:R(-160,160),rotation:R(-120,120),scale:R(1.2,1.9),transformOrigin:'50% 90%'},
      {y:0,x:0,rotation:0,scale:1,duration:.34,ease:'power4.in'},t)
      .to(el,{keyframes:[{scaleY:.72,scaleX:1.2,duration:.05},{scaleY:1.12,scaleX:.92,duration:.07},{scaleY:1,scaleX:1,duration:.06}]},t+.34)
      .add(()=>shake(9,.16),t+.34);
  });
  tl.add(()=>{shake(30,.55);flash('#33ea1f',.45)},2.05+L.length*.11+.4);
  // texts
  const T0=3.1;
  ids(/^p1_tTL_/).forEach((el,i)=>glitchIn(tl,el,T0+i*.18));
  ids(/^p1_tTR_/).forEach((el,i)=>glitchIn(tl,el,T0+.4+i*.12));
  ids(/^p1_tR_/).forEach((el,i)=>glitchIn(tl,el,T0+.7+i*.1,.45));
  ids(/^p1_tL_/).forEach((el,i)=>glitchIn(tl,el,T0+.5+i*.055,.4));
  ids(/^p1_tUrl_/).forEach(el=>glitchIn(tl,el,T0+1.2,.7));
  // the chant: each word stamped like a shout
  ids(/^p1_tCry_/).forEach((el,i)=>stamp(tl,el,T0+1.5+i*.32,R(-18,18)));
  tl.add(startIdle1);
  return tl;
}
function startIdle1(){
  if(RM)return;
  const L=ids(/^p1_L\d$/);
  // nervous punk jitter: letters twitch in hard steps, never smoothly
  L.forEach((el,i)=>idle1.push(gsap.to(el,{keyframes:[{rotation:R(-5,5),y:R(-10,4)},{rotation:R(-4,4),y:R(-3,3)},{rotation:0,y:0}],duration:.9+R(0,.6),ease:'steps(3)',repeat:-1,repeatDelay:R(.2,1.4),delay:i*.07})));
  idle1.push(gsap.to(E.p1_mouth,{scale:1.035,duration:.45,ease:'steps(2)',repeat:-1,yoyo:true,transformOrigin:'45% 55%'}));
  idle1.push(gsap.to(E.p1_cross,{rotation:2.5,duration:1.1,ease:'steps(3)',repeat:-1,yoyo:true,transformOrigin:'70% 90%'}));
  idle1.push(gsap.to(E.p1_fig,{x:6,duration:.12,ease:'steps(1)',repeat:-1,yoyo:true,repeatDelay:2.2}));
  // every few seconds the logo kicks to say "click me"
  idle1.push(gsap.to(logoBox,{keyframes:[{x:-10,rotation:-1.2,duration:.05},{x:9,rotation:1,duration:.05},{x:-5,duration:.05},{x:0,rotation:0,duration:.05}],repeat:-1,repeatDelay:3.2,delay:1.5,transformOrigin:'50% 50%'}));
  // the chant keeps shouting
  ids(/^p1_tCry_/).forEach((el,i)=>idle1.push(gsap.to(el,{keyframes:[{scale:1.18,rotation:R(-6,6),duration:.06},{scale:1,rotation:0,duration:.1}],repeat:-1,repeatDelay:4,delay:2+i*.18,transformOrigin:'100% 50%'})));
}

/* ---------- PAGE 2 ---------- */
function syncStrings(){
  pups.forEach(id=>{const el=E[id];if(!el)return;const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect(),k=1920/s.width;
    strLines[id].forEach((l,i)=>{const f=+l.dataset.f;const x=(r.left-s.left+r.width*f)*k,y=(r.top-s.top+r.height*(i===1?0.06:0.38))*k;
      l.setAttribute('x1',x+R(-1,1));l.setAttribute('y1',-10);l.setAttribute('x2',x);l.setAttribute('y2',y);});});
}
function page2(){
  killIdle(idle2);
  const tl=gsap.timeline({onUpdate:syncStrings});
  const all=[...p2.querySelectorAll('.L')];
  gsap.set(all,{clearProps:'transform,opacity,clipPath,filter'});
  if(RM){syncStrings();return tl}
  tl.fromTo(E.p2_bg,{opacity:0},{opacity:1,duration:.25,ease:'steps(4)'},0);
  // the crowd jumps up from below
  tl.fromTo(E.p2_crowd,{y:600},{y:0,duration:.4,ease:'power4.in'},.1).add(()=>shake(18,.35),.5)
    .to(E.p2_crowd,{keyframes:[{y:-30,duration:.08},{y:0,duration:.1},{y:-14,duration:.06},{y:0,duration:.08}]},.5);
  // newspaper ripped open
  tl.fromTo(E.p2_news,{clipPath:'polygon(50% 50%,50% 50%,50% 50%,50% 50%,50% 50%,50% 50%)',rotation:-4,transformOrigin:'50% 50%'},
    {clipPath:'polygon(-10% -10%,40% -8%,110% -10%,110% 110%,60% 108%,-10% 110%)',rotation:0,duration:.55,ease:'steps(6)'},.45);
  // puppets: pulled up from below on strings, one after another
  pups.forEach((id,i)=>{
    const el=E[id],t=1+i*.45;
    tl.fromTo(el,{y:900,rotation:R(-25,25),transformOrigin:'50% 0%'},{y:-60,rotation:R(-6,6),duration:.42,ease:'power3.out'},t)
      .to(el,{y:0,rotation:0,duration:.6,ease:'elastic.out(1.1,0.35)'},t+.42)
      .add(()=>shake(10,.2),t+.45);
  });
  // names: every letter stamped in, in the order each musician appears
  const order=[['n0a','n0b','n0c'],['n1a','n1b','n1c'],['n2a','n2b','n2c']];
  order.forEach((g,pi)=>{
    let t=1.35+pi*.45;
    g.forEach(line=>{
      ids(new RegExp('^p2_'+line+'_\\d+$')).forEach((el,i)=>{
        tl.fromTo(el,{scale:0,rotation:R(-90,90),y:-40,opacity:0,transformOrigin:'50% 50%'},{scale:1,rotation:0,y:0,opacity:1,duration:.16,ease:'back.out(4)'},t+i*.028);
      });
      t+=.32;
    });
  });
  // urls, spotify, equaliser
  ['p2_url0','p2_url3','p2_url1','p2_url2'].forEach((id,i)=>E[id]&&glitchIn(tl,E[id],2.7+i*.15,.5));
  tl.fromTo(E.p2_spot,{scale:0,rotation:-200,transformOrigin:'50% 50%'},{scale:1,rotation:0,duration:.4,ease:'back.out(2.5)'},2.8);
  ids(/^p2_bar\d+$/).forEach((el,i)=>tl.fromTo(el,{scaleY:0,transformOrigin:'50% 50%'},{scaleY:1,duration:.12,ease:'steps(3)'},2.95+i*.025));
  tl.fromTo(back,{scale:0,rotation:-90},{scale:1,rotation:-6,duration:.3,ease:'back.out(3)'},3.1);
  tl.add(startIdle2);
  return tl;
}
function startIdle2(){
  if(RM)return;
  // marionettes: swing from the top, hard and uneven
  pups.forEach((id,i)=>{
    const el=E[id];
    idle2.push(gsap.to(el,{rotation:i%2?2.6:-2.6,y:-12,duration:.5+i*.08,ease:'sine.inOut',repeat:-1,yoyo:true,transformOrigin:'50% 0%',onUpdate:syncStrings,delay:i*.2}));
    idle2.push(gsap.to(el,{keyframes:[{y:-46,duration:.09},{y:0,duration:.14}],repeat:-1,repeatDelay:2.6+i*.7,delay:1+i*.5}));
  });
  // the crowd pogos
  idle2.push(gsap.to(E.p2_crowd,{y:-16,duration:.3,ease:'steps(2)',repeat:-1,yoyo:true}));
  // equaliser
  ids(/^p2_bar\d+$/).forEach(el=>idle2.push(gsap.to(el,{scaleY:()=>R(.25,1.6),duration:.14,ease:'steps(1)',repeat:-1,repeatRefresh:true})));
  idle2.push(gsap.to(E.p2_spot,{rotation:360,duration:5,ease:'steps(24)',repeat:-1}));
  // names twitch
  ids(/^p2_n\d[abc]_\d+$/).forEach((el,i)=>idle2.push(gsap.to(el,{keyframes:[{rotation:R(-20,20),y:R(-6,0),duration:.06},{rotation:0,y:0,duration:.08}],repeat:-1,repeatDelay:R(2,6),delay:R(0,4)})));
}

/* ---------- switching ---------- */
let cur=1,busy=false;
function wipe(color,mid){
  const bs=[...bands.children];
  const tl=gsap.timeline();
  tl.set(bs,{background:color,transformOrigin:'left'})
    .to(bs,{scaleX:1,duration:.18,ease:'steps(3)',stagger:{each:.025,from:'random'}})
    .add(()=>{shake(24,.4);mid()})
    .set(bs,{transformOrigin:'right'})
    .to(bs,{scaleX:0,duration:.18,ease:'steps(3)',stagger:{each:.025,from:'random'}},'+=.08');
  return tl;
}
function go(n){
  if(busy||n===cur)return;busy=true;
  if(RM){show(n);busy=false;return}
  // the logo explodes before the wipe
  if(n===2){gsap.to(ids(/^p1_L\d$/),{y:()=>R(-500,-900),x:()=>R(-400,400),rotation:()=>R(-200,200),duration:.35,ease:'power2.in',stagger:.02});
            gsap.to([E.p1_mouth,E.p1_cross],{scale:1.6,opacity:0,duration:.3,ease:'steps(4)'});}
  flash(n===2?'#33ea1f':'#a838ff',.9);
  gsap.delayedCall(.2,()=>wipe(n===2?'#33ea1f':'#a838ff',()=>{show(n);busy=false;}));
}
function show(n){
  cur=n;
  p1.hidden=n!==1;p2.hidden=n!==2;
  p1.setAttribute('aria-hidden',n!==1);p2.setAttribute('aria-hidden',n!==2);
  stage.style.background=n===1?'var(--purple)':'var(--toxic)';
  // the bus keeps its place on the road; only its lane changes
  const m=n===1?busP1:busP2;busImg.src=m.src;
  gsap.to(busEl,{top:m.y,width:m.w,height:m.h,duration:.3,ease:'steps(3)'});
  if(n===1){killIdle(idle2);page1()}else{killIdle(idle1);page2()}
  (n===1?hit:back).focus({preventScroll:true});
}
hit.addEventListener('click',()=>go(2));
back.addEventListener('click',()=>go(1));
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur===2)go(1)});
hit.addEventListener('mouseenter',()=>{if(!RM&&cur===1)gsap.to(ids(/^p1_L\d$/),{y:()=>R(-24,-6),rotation:()=>R(-8,8),duration:.08,ease:'steps(1)',yoyo:true,repeat:1,stagger:.02})});

page1();
</script>

</body></html>
